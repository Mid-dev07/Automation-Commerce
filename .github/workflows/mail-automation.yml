name: Mail automation checks

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "mail-automation/**"
      - ".github/workflows/mail-automation.yml"
  pull_request:
    branches: [main, feat/fase-1-digital-delivery-otp]
    paths:
      - "mail-automation/**"
      - ".github/workflows/mail-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mail-automation
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
