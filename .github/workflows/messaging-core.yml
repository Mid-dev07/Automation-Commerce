name: Messaging Core

on:
  push:
    branches:
      - main
    paths:
      - "messaging-core.mjs"
      - "migrations/**"
      - "tests/messaging-core.test.mjs"
      - "worker.js"
      - ".github/workflows/messaging-core.yml"
  pull_request:
    paths:
      - "messaging-core.mjs"
      - "migrations/**"
      - "tests/messaging-core.test.mjs"
      - "worker.js"
      - ".github/workflows/messaging-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messaging-core-tests:
    name: Messaging Core unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Telegram Worker syntax
        run: node --check worker.js
      - name: Run Telegram Worker contract tests
        run: node --test tests/worker-contract.test.cjs
      - name: Run Messaging Core tests
        run: node --test tests/messaging-core.test.mjs
