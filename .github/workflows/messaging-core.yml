name: Messaging Core

on:
  push:
    branches:
      - main
    paths:
      - "messaging-core.mjs"
      - "migrations/**"
      - "tests/messaging-core.test.mjs"
      - "tests/qris.test.mjs"
      - "tests/worker-contract.test.cjs"
      - "tests/transaction-layer-contract.test.cjs"
      - "transaction-layer.js"
      - "qris.mjs"
      - "worker.js"
      - ".github/workflows/messaging-core.yml"
  pull_request:
    paths:
      - "messaging-core.mjs"
      - "migrations/**"
      - "tests/messaging-core.test.mjs"
      - "worker.js"
      - ".github/workflows/messaging-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messaging-core-tests:
    name: Messaging Core unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Worker syntax
        run: |
          node --check worker.js
          node --check src/order-bot/utils.mjs
          node --check src/order-bot/dashboard-html.mjs
          node --check src/order-bot/keyboards.mjs
          node --check src/order-bot/telegram-api.mjs
          node --check src/order-bot/sheets-client.mjs
          node --check src/order-bot/reports.mjs
          node --check src/order-bot/pickup.mjs
          node --check src/order-bot/handlers.mjs
          node --check src/order-bot/ui/formatters.mjs
          node --check src/order-bot/ui/keyboards.mjs
          node --check src/order-bot/ui/screens.mjs
          node --check src/order-bot/ui/state.mjs
          node --check src/order-bot/ui/controller.mjs
      - name: Check transaction and QRIS modules
        run: |
          node --check transaction-layer.js
          node --check qris.mjs
      - name: Run Worker and transaction contracts
        run: node --test tests/worker-contract.test.cjs tests/transaction-layer-contract.test.cjs
      - name: Run QRIS library tests
        run: node --test tests/qris.test.mjs
      - name: Run Messaging Core tests
        run: node --test tests/messaging-core.test.mjs
