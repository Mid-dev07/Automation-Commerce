name: Worker audit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check transactional module syntax
        run: node --check transaction-layer.js
      - name: Check digital products module syntax
        run: node --check digital-products.mjs
      - name: Check OTP portal legacy Worker syntax
        run: node --check otp-portal/worker.js
      - name: Check deployed OTP portal entrypoint syntax
        run: node --check otp-portal/index.js
      - name: Check OTP email parser syntax
        run: node --check otp-portal/email-parser.js
      - name: Check site-admin Worker syntax
        run: node --check site-admin/worker.js
      - name: Check Mail Automation Worker syntax
        run: node --check mail-automation/worker.js
      - name: Check TMail agent client syntax
        run: node --check mail-automation/agent-client.mjs
      - name: Check TMail TOTP module syntax
        run: node --check mail-automation/totp.mjs
      - name: Check public TMail page syntax
        run: node --check mail-automation/public-page.mjs
      - name: Check Mail Automation email parser syntax
        run: node --check mail-automation/email-parser.js
      - name: Check Mail Automation OTP extractor syntax
        run: node --check mail-automation/otp-extractor.js
      - name: Check owner operations module syntax
        run: node --check site-admin/owner-operations.js
      - name: Run regression tests
        run: node --test tests/*.test.cjs tests/*.test.mjs otp-portal/*.test.mjs
