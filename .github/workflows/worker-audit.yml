name: Worker audit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false

        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Run regression tests
        run: node --test tests/worker-contract.test.cjs
